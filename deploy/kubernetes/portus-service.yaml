# Skeleton Service for tpt-portus. Exposes the mTLS gRPC port (DESIGN.md §4.4).
apiVersion: v1
kind: Service
metadata:
  name: portus
  labels:
    app.kubernetes.io/name: tpt-portus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tpt-portus
  ports:
    - name: grpc
      port: 9400
      targetPort: grpc
